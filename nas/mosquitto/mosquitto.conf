listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Development default. For production:
# 1. create a password file with: mosquitto_passwd -c /mosquitto/config/passwd battery
# 2. set allow_anonymous false
# 3. uncomment password_file
allow_anonymous true
# password_file /mosquitto/config/passwd
