mqtt:
  host: mosquitto
  port: 1883
  username: ""
  password: ""
  base_topic: battery

devices:
  - id: bench-01
    port: /dev/ttyUSB0
    baud: 115200
    profile: bench_6v
    location: Lab bench
    heartbeat_interval_s: 5
    enabled: true
