[platformio]
default_envs = blackpill_f411ce_bench
src_dir = .

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -Iinclude
    -Icore
    -Idrivers
    -Iapp
    -Iml
    -DUSE_HAL_DRIVER
    -DSTM32F411xE
build_src_filter =
    +<src/>
    +<core/>
    +<drivers/>
    +<app/>
    +<ml/>
    -<tests/>

[env:blackpill_f411ce_bench]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags} -DAPP_PROFILE_ID=1

[env:blackpill_f411ce_ev_pack]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags} -DAPP_PROFILE_ID=2

[env:blackpill_f411ce_server_ups]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags} -DAPP_PROFILE_ID=3

[env:blackpill_f411ce_solar_cabinet]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags} -DAPP_PROFILE_ID=4

[env:blackpill_f411ce_cold_chain]
extends = env:blackpill_f411ce
build_flags = ${env:blackpill_f411ce.build_flags} -DAPP_PROFILE_ID=5
